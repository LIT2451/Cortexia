name: Build site

# Builds the static site and uploads out/ as the "cortexia-site" artifact.
# Download it from the run page and copy its contents to the IIS site folder on the VPS.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check
      - uses: actions/upload-artifact@v4
        with:
          name: cortexia-site
          path: out
          include-hidden-files: true
          retention-days: 30
